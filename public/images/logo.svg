<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" fill="none">
  <defs>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C1A2" />
      <stop offset="50%" stop-color="#C9A27E" />
      <stop offset="100%" stop-color="#B38964" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A27E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C9A27E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Emblem Background (Squircle) -->
  <rect x="6" y="6" width="48" height="48" rx="12" fill="#2B1B14" stroke="#C9A27E" stroke-width="1.2" stroke-opacity="0.6" />
  <rect x="6" y="6" width="48" height="48" rx="12" fill="url(#ambientGlow)" />

  <!-- Letter 'M' Architecture -->
  <path d="M19 40V24L30 33L41 24V40" stroke="url(#logoGoldGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central 'A' Crossbar -->
  <line x1="24" y1="32" x2="36" y2="32" stroke="#FAF7F2" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Accent Vertex Node -->
  <circle cx="30" cy="20" r="1.8" fill="#C9A27E" />

  <!-- Wordmark: Muhammad Ali -->
  <text x="68" y="32" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#FFFFFF" font-weight="500" letter-spacing="0.5">
    Muhammad Ali
  </text>

  <!-- Subtitle: Full-Stack Developer -->
  <text x="68" y="45" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#C9A27E" font-weight="600" letter-spacing="1.5">
    FULL-STACK DEVELOPER
  </text>
</svg>

